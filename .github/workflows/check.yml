name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install graphql-core
      - name: Validate the operations against the schema snapshots
        run: python scripts/check.py
      - name: Shellcheck
        run: shellcheck scripts/sync.sh
